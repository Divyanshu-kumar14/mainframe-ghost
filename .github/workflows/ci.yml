name: parity-gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Unit + property tests
        run: pytest -q --tb=short
      - name: Golden path - hardened passes
        run: python3 engine/shadow_fuzzer.py --candidate services/hardened_service.py
      - name: Golden path - float vetoes
        run: |
          python3 engine/shadow_fuzzer.py --candidate tests/fixtures/candidates/round_floor.py; rc=$?; if [ $rc -ne 2 ]; then echo "expected exit 2, got $rc"; exit 1; fi
