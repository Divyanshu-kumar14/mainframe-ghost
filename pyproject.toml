[project]
name = "mainframe-ghost"
version = "0.1.0"
description = "Kiro PreToolUse gate that verifies AI-ported COBOL against GnuCOBOL output"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp==4.1.6"]
aws = ["boto3>=1.35"]
dev = ["pytest==9.2.0", "hypothesis==6.170.15"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "services*", "cockpit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
